spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_db
    username: fitness
    password: ${DB_PASSWORD:falsepassword}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

app:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  jwt-secret: ${JWT_SECRET}
  jwt-expiration-ms: 86400000 # 24h
  video-storage-path: ${VIDEO_STORAGE_PATH:/Users/danielpantiuc/fitness-videos}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics